name: pages
# Every push to main that touches dist/ deploys it to Cloudflare Pages (sunroom.colefoster.ca).
on:
  push:
    branches: [main]
    paths: ["dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name sunroom --branch main
